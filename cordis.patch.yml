# dsh-matrix bundle layer: inserts the Matrix bridge row into the composition.
# Patch rows win per-row by id; the whole `config` value is replaced, not merged.
#
# 架构约定（每分身一个 harness 进程）：
#   - userId      = 本进程登录的数字分身账号（分身自己）
#   - owner       = 真实人账号（仅在 Matrix 客户端登录，不在任何 harness 登录）
#   - 审批/吊销授权仅 owner 可应答
#
# 安全约定：本文件进入 git/npm 发布，绝不写真实 accessToken。
# accessToken 留空 = 回退到环境变量 DSH_MATRIX_TOKEN（两者都没有则插件加载失败）。
- insert:
    - id: matrix
      name: dsh-matrix-agent
      config:
        homeserverUrl: 'https://im-ipm.ict.cmcc'
        # 本进程登录的分身账号（@ai-xxxxxxxx 分身自己）
        userId: '@ai-xxxxxxxx:im-ipm.ict.cmcc'
        # accessToken 留空时回退到环境变量 DSH_MATRIX_TOKEN（两者都没有则插件加载失败）
        accessToken: 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
        # 工作责任负责人：真实人账号 @xxxxxxx（仅在 Matrix 客户端登录）
        # 设置后：审批/吊销仅 @xxxxxxx 可应答；其消息也被放行
        owner: '@xxxxxxx:im-ipm.ict.cmcc'
        # 响应房间所有消息（分身与专人/其他分身/真人同事协作）——volatile 可热改，
        # 此处写 false 作为「分身默认只响应 @」的部署初始值（覆盖 schema default true）。
        respondToAll: false
        # 允许任意用户（测试环境 true）——volatile 可热改，此处写 true 作部署初始值。
        # 生产 fail-closed 建议删此行回退 schema default false。
        allowAllUsers: true
        provider: 'codebuddy'
        # 以下 volatile 字段（model/agentPreset/chunkMaxChars/allowedUserIds）不写进 patch：
        # 其 schema default 已是合理通用值，设置页编辑后写盘到独立 patch 层覆盖。
        # model 默认 deepseek-v4-flash、agentPreset 默认 standard（见 config.ts）。
        mergeTimeoutSecs: 5
        approvalTimeoutSecs: 300
        stateDir: '.dsh-matrix'
        # 本进程只跑一个分身；其它分身（如 @ai-xxxxxxx-dev）请用独立 profile/进程
        digitalTwinMode: false
        digitalTwins: []
