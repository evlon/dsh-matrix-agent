# dsh-matrix-agent bundle layer: inserts the Matrix bridge row into the composition.
# Patch rows win per-row by id; the whole `config` value is replaced, not merged.
#
# 架构约定（每分身一个 harness 进程）：
#   - userId      = 本进程登录的数字分身账号（分身自己）
#   - owner       = 真实人账号（仅在 Matrix 客户端登录，不在任何 harness 登录）
#   - 审批/吊销授权仅 owner 可应答
- insert:
    - id: matrix
      name: dsh-matrix-agent
      config:
        homeserverUrl: 'https://im-ipm.ict.cmcc'
        # 本进程登录的分身账号（@ai-xxxxxxxx 分身自己）
        userId: '@ai-xxxxxxxx:im-ipm.ict.cmcc'
        # accessToken 留空时回退到环境变量 DSH_MATRIX_TOKEN（两者都没有则插件加载失败）
        accessToken: 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
        # 工作责任负责人：真实人账号 @xxxxxxx（仅在 Matrix 客户端登录）
        # 设置后：审批/吊销仅 @xxxxxxx 可应答；其消息也被放行
        owner: '@xxxxxxx:im-ipm.ict.cmcc'
        # 响应房间所有消息（分身与专人/其他分身/真人同事协作）
        respondToAll: false
        # 白名单为空且 allowAllUsers=false 时拒绝所有入站消息（fail closed）
        allowedUserIds: []
        allowAllUsers: true
        provider: 'xxxxxx'
        model: 'deepseek-v4-flash'
        # room agent 挂载的 agent preset：决定工具集与角色提示。
        # 安全兜底：用 'standard'（内置必然存在），绝不写死某个岗位。岗位由「分身工作台 →
        # 岗位 tab」或激活时选的默认岗位（agent-presets.default）动态注入；写死某岗位会因
        # 该岗位未安装/已下架而 fatal load failure。
        # ⚠️ 无头（服务器无人值守）环境：standard 会挂载 ask_user_question / plan-mode 两个
        #    「问人」工具，把问题推给 web answerer（主人不在电脑旁 → 请示到不了人）。
        #    因此生产应通过「选岗位」把 agent-presets.default 设为岗位 preset（如 secretary/
        #    leader/reception），岗位 preset 的问人走 matrix_request_owner_decision（DM 私聊
        #    主人，有超时兜底）。详见 docs/审批问人走私聊.md。
        agentPreset: 'standard'
        chunkMaxChars: 4000
        mergeTimeoutSecs: 5
        approvalTimeoutSecs: 300
        stateDir: '.dsh-matrix'
        # 本进程只跑一个分身；其它分身（如 @ai-xxxxxxx-dev）请用独立 profile/进程
        digitalTwinMode: false
        digitalTwins: []
        # ── 以下为 volatile 字段（可在设置页热改），默认值已内置，通常无需写进 patch ──
        # AI 接待层（receptionEnabled）0.5.1 起默认启用（true）：入站消息先经接待 agent
        # 语义分类，判定失败/超时才回退正则兜底。若新环境需关闭，显式写 receptionEnabled: false。
