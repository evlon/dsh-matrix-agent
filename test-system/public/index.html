<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数字人测试台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🧪 数字人测试台</h1>
    <div class="topbar-right">
      <div class="scenario-controls">
        <select id="scenario-select" class="ctl-select" title="选择测试场景"></select>
        <button id="btn-scenario-start" class="ctl-btn primary">▶ 开始测试</button>
        <button id="btn-scenario-restart" class="ctl-btn" title="重新开始当前场景">🔄 重新开始</button>
        <button id="btn-scenario-stop" class="ctl-btn danger">⏹ 停止</button>
      </div>
      <span id="scenario-info" class="scenario-info"></span>
      <div class="global-controls">
        <button id="btn-pause-all" class="ctl-btn" title="暂停全部房间">⏸ 全部暂停</button>
        <button id="btn-resume-all" class="ctl-btn" title="继续全部房间">▶ 全部继续</button>
        <button id="btn-stop-all" class="ctl-btn danger" title="停止全部房间">⏹ 全部停止</button>
      </div>
      <span id="conn-status" class="conn-status">连接中…</span>
    </div>
  </header>
  <main class="layout">
    <aside class="rooms-panel">
      <h2>房间</h2>
      <div id="room-list" class="room-list"><p class="muted">等待场景启动…</p></div>
    </aside>
    <div id="layout-splitter" class="layout-splitter" title="拖拽调整宽度"></div>
    <section class="chat-panel">
      <div id="chat-header" class="chat-header"><h2>选择一个房间查看对话</h2></div>
      <div id="chat-stream" class="chat-stream"></div>
      <div id="control-bar" class="control-bar" style="display:none">
        <div class="control-row">
          <span class="control-label">干预：</span>
          <button class="ctl-btn" data-act="pause">⏸ 暂停</button>
          <button class="ctl-btn" data-act="resume">▶ 继续</button>
          <button class="ctl-btn" data-act="skip-wait">⏭ 跳过等待</button>
          <button class="ctl-btn danger" data-act="stop">⏹ 停止</button>
          <button class="ctl-btn" data-act="room-restart" title="重跑本房间">🔄 重跑本房间</button>
        </div>
        <div class="control-row">
          <span class="control-label">换同事：</span>
          <select id="ctl-colleague" class="ctl-select"></select>
          <button class="ctl-btn" data-act="switch">切换</button>
        </div>
        <div class="control-row">
          <span class="control-label">注入：</span>
          <select id="inj-identity" class="ctl-select"></select>
          <input id="inj-text" class="ctl-input" placeholder="输入消息内容…" />
          <button class="ctl-btn primary" data-act="inject">发送</button>
        </div>
        <div id="ctl-msg" class="ctl-msg"></div>
      </div>
    </section>
    <aside class="owner-panel">
      <div class="owner-header">
        <h2>👤 主人区域</h2>
        <div class="owner-mode">
          <label title="AI 自动批准请示">驱动：</label>
          <select id="owner-mode-select" class="ctl-select">
            <option value="auto" selected>🤖 AI 自动</option>
            <option value="manual">🧑 真人答复</option>
          </select>
        </div>
      </div>
      <div id="owner-inbox" class="owner-inbox"><p class="muted">暂无请示…</p></div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
